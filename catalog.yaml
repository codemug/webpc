# WebPC catalog: every app on the desktop, whether it is built, and every pinned upstream release.
# The builder (npm run build) reads it; the upgrader (npm run upgrade) bumps the pins in it.
#   enabled: false   -> the app is not prepared, not on the desktop and ships no bytes.
#   upgrade: auto    -> the scheduled upgrader may bump this source (tests and a smoke check must pass).
#   upgrade: manual  -> the upgrader only reports newer releases (hand-written adapters, AI models).
# Field order per app: desktop entry (title ... height), then sources.
apps:
  - id: gridcraft
    enabled: true
    title: GridCraft
    category: Office
    keywords: [ spreadsheet, grid, excel, xlsx, csv, ods, calculate, sheets ]
    description: Create and edit spreadsheets (XLSX, CSV, ODS).
    src: /pc/apps/gridcraft/
    kind: iframe
    loadTimeout: 75000
    width: 1180
    height: 760
    sources:
      - type: github-release
        repo: storytold/gridcraft
        tag: v0.19.1
        asset: gridcraft-web-*.zip
        url: https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-web-0.19.1.zip
        sha256: 48c5d1b101befebb3c5ba3b7a14914f01c3207934813ed07dc4251b7ae116a78
        upgrade: auto
