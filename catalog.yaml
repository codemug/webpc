# WebPC catalog: every app on the desktop, whether it is built, and every pinned upstream release.
# The builder (npm run build) reads it; the upgrader (npm run upgrade) bumps the pins in it.
#   enabled: false   -> the app is not prepared, not on the desktop and ships no bytes.
#   upgrade: auto    -> the scheduled upgrader may bump this source (tests and a smoke check must pass).
#   upgrade: manual  -> the upgrader only reports newer releases (hand-written adapters, AI models).
#   folder: Games    -> the app sits in that desktop folder instead of on the desktop (the launcher lists it as usual)
#   kind: panel      -> not a desktop app: the taskbar's bottom-left button opens it in a side panel (Buddy). At most one.
#   icon             -> the app's upstream icon, served at /pc/icons/<id> (apps without one keep WebPC's tile):
#                       { from: repo, path, sha256 }  file in the app's GitHub-release repo at its tag (re-pinned on upgrade)
#                       { from: release, path }       file inside the app's prepared release
#                       { url, sha256 }               fixed https URL
#   wasm.build       -> the command that builds this app's wasm from its source repository, at the pinned
#                       version (required for every packaged kind: iframe app; WebPC's build never runs it, it
#                       ships the upstream artifact). Exempt: the closed LEGACY_NON_WASM list in
#                       scripts/catalog/catalog.mjs, and external/panel apps (WebPC does not package them).
# Field order per app: desktop entry (title ... height), wasm, icon, then sources.
apps:
  - id: gridcraft
    enabled: true
    title: GridCraft
    category: Office
    keywords: [ spreadsheet, grid, excel, xlsx, csv, ods, calculate, sheets ]
    description: Create and edit spreadsheets (XLSX, CSV, ODS).
    src: /pc/apps/gridcraft/
    kind: iframe
    loadTimeout: 75000
    width: 1180
    height: 760
    wasm:
      build: "cd apps/gridcraft-web && trunk build --release"
    icon:
      from: repo
      path: assets/app-icon/hicolor/256x256/apps/ai.storyteller.gridcraft.png
      sha256: 3d8cb180ae9ea3691051e8d2309e79baf6f69e0a86276bf50265b5867ff26e41
    sources:
      - type: github-release
        repo: storytold/gridcraft
        tag: v0.19.1
        asset: gridcraft-web-*.zip
        url: https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-web-0.19.1.zip
        sha256: 48c5d1b101befebb3c5ba3b7a14914f01c3207934813ed07dc4251b7ae116a78
        upgrade: auto
